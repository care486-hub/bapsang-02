<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 밥상</title>
<style>
  :root {
    --bg: #39ff14;          /* 형광 초록 */
    --bg-dot: #2ee00c;
    --ink: #3b2a1e;         /* 먹색 갈색 */
    --ink-soft: #7a5e48;
    --accent: #b23a2a;      /* 단청 주홍 */
    --table: #8a4b2a;       /* 소반 나무 */
    --table-dark: #6a3519;
    --table-rim: #a9643b;
    --card: #fffaf1;
    --card-edge: #e6cfae;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    color: var(--ink);
    background:
      radial-gradient(var(--bg-dot) 1px, transparent 1.5px) 0 0 / 18px 18px,
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
  }
  header { text-align: center; margin-bottom: 24px; }
  h1 {
    margin: 0;
    font-size: clamp(28px, 6vw, 42px);
    letter-spacing: 0.2em;
    font-weight: 700;
  }
  h1::after {
    content: "";
    display: block;
    width: 48px; height: 3px;
    margin: 12px auto 0;
    background: var(--accent);
    border-radius: 2px;
  }
  .date { margin-top: 10px; color: var(--ink-soft); font-size: 15px; letter-spacing: 0.05em; min-height: 1em; }

  /* 둥근 상 — 안의 크기는 모두 상 너비(cqw) 기준 */
  .table {
    position: relative;
    width: min(560px, 92vw);
    aspect-ratio: 1;
    border-radius: 50%;
    container-type: inline-size;
    display: grid;
    place-items: center;
    background:
      repeating-radial-gradient(circle at 50% 50%, transparent 0 14px, rgba(0,0,0,.035) 14px 15px),
      radial-gradient(circle at 40% 35%, var(--table-rim), var(--table) 55%, var(--table-dark));
    box-shadow:
      inset 0 0 0 10px var(--table-dark),
      inset 0 0 0 13px var(--table-rim),
      0 24px 40px -12px rgba(80, 40, 15, .45),
      0 6px 0 var(--table-dark);
  }

  /* 반찬 목록 = 상 위의 카드 (스크립트 없이도 보임) */
  #banchan {
    --size: 20cqw;
    list-style: none;
    margin: 0; padding: 0;
    width: 72%;
    display: flex; flex-wrap: wrap;
    justify-content: center; align-content: center;
    gap: 3cqw;
  }
  #banchan li {
    width: var(--size);
    aspect-ratio: 3 / 4;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: calc(var(--size) * 0.14);
    box-shadow: 0 8px 16px -6px rgba(50, 25, 10, .5);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: calc(var(--size) * 0.06);
    font-size: max(11px, calc(var(--size) * 0.14));
    font-weight: 700;
    letter-spacing: 0.06em;
    text-align: center;
    word-break: keep-all;
    transition: transform .2s ease;
  }
  #banchan li::before {
    content: attr(data-emoji);
    font-size: calc(var(--size) * 0.42);
    line-height: 1;
  }
  #banchan li:not([data-emoji]):not([data-art])::before { content: "🍽️"; }
  #banchan li:hover { transform: translateY(-6px); }

  /* 그림 반찬: <li data-art="그림키">이름</li> */
  #banchan li[data-art]::before {
    content: "";
    width: 88%;
    aspect-ratio: 6 / 5;
    margin-top: -6%;
    background: var(--art) center / contain no-repeat;
  }

<body>

<header>
  <h1>오늘의 밥상</h1>
  <div class="date" id="date"></div>
</header>

<div class="table" aria-label="밥상">
<!--
  ===== 반찬 목록 =====
  한 줄에 하나씩: <li data-emoji="이모지">이름</li>
  예) <li data-emoji="🥚">Rolled Omelet</li>
      <li data-emoji="🐟">Grilled Mackerel</li>
-->
<ul id="banchan">
  <li data-emoji="🍚">Rice</li>
  <li data-emoji="🍲">Soup</li>
  <li data-emoji="🥬">Kimchi</li>
  <li data-art="donkatsu">Pork Cutlet</li>
  <li data-art="lamb">Lamb Chops</li>
  <li data-emoji="🐟">Pacific Saury</li>
</ul>
</div>

<p class="count" id="count"></p>

<script>
  const list = document.getElementById('banchan');
  const cards = [...list.children];
  const n = cards.length;

  // 반찬 수에 따라 카드 크기와 배치 반지름 조절 (상 너비 대비 %)
  const size = n <= 3 ? 24 : n <= 5 ? 21 : n <= 8 ? 17 : Math.max(11, 17 - (n - 8));
  const radius = n === 1 ? 0 : n <= 3 ? 24 : 34 - size * 0.3;

  list.style.setProperty('--size', size + 'cqw');
  cards.forEach((li, idx) => {
    const angle = -Math.PI / 2 + (idx / n) * Math.PI * 2;
    li.style.setProperty('--x', (50 + radius * Math.cos(angle)) + '%');
    li.style.setProperty('--y', (50 + radius * Math.sin(angle)) + '%');
  });
  list.classList.add('ring');

  document.getElementById('count').textContent = `오늘은 ${n}가지 찬이 올라왔어요.`;
  const d = new Date();
  document.getElementById('date').textContent =
    `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`;
</script>
</body>
</html>
