<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 밥상</title>
<style>
  :root {
    --bg: #f6ecdc;          /* 한지 */
    --bg-dot: #ead9bf;
    --ink: #3b2a1e;         /* 먹색 갈색 */
    --ink-soft: #7a5e48;
    --accent: #b23a2a;      /* 단청 주홍 */
    --table: #8a4b2a;       /* 소반 나무 */
    --table-dark: #6a3519;
    --table-rim: #a9643b;
    --card: #fffaf1;
    --card-edge: #e6cfae;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    color: var(--ink);
    background:
      radial-gradient(var(--bg-dot) 1px, transparent 1.5px) 0 0 / 18px 18px,
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
  }
  header { text-align: center; margin-bottom: 24px; }
  h1 {
    margin: 0;
    font-size: clamp(28px, 6vw, 42px);
    letter-spacing: 0.2em;
    font-weight: 700;
  }
  h1::after {
    content: "";
    display: block;
    width: 48px; height: 3px;
    margin: 12px auto 0;
    background: var(--accent);
    border-radius: 2px;
  }
  .date { margin-top: 10px; color: var(--ink-soft); font-size: 15px; letter-spacing: 0.05em; }

  /* 둥근 상 */
  .table {
    position: relative;
    width: min(560px, 92vw);
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, transparent 0 14px, rgba(0,0,0,.035) 14px 15px),
      radial-gradient(circle at 40% 35%, var(--table-rim), var(--table) 55%, var(--table-dark));
    box-shadow:
      inset 0 0 0 10px var(--table-dark),
      inset 0 0 0 13px var(--table-rim),
      0 24px 40px -12px rgba(80, 40, 15, .45),
      0 6px 0 var(--table-dark);
  }
  .dish {
    position: absolute;
    left: var(--x); top: var(--y);
    width: var(--size); aspect-ratio: 3 / 4;
    transform: translate(-50%, -50%);
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 16px;
    box-shadow: 0 8px 16px -6px rgba(50, 25, 10, .5);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6%;
    transition: transform .2s ease;
    animation: serve .5s ease both;
    animation-delay: var(--delay);
  }
  .dish:hover { transform: translate(-50%, -54%); }
  .dish .emoji { font-size: calc(var(--size) * 0.42); line-height: 1; }
  .dish .name {
    font-size: max(12px, calc(var(--size) * 0.14));
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  @keyframes serve {
    from { opacity: 0; transform: translate(-50%, -30%); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }
  .count { margin-top: 28px; color: var(--ink-soft); font-size: 14px; }

  /* 반찬 원본 목록은 화면에 보이지 않음 */
  #banchan { display: none; }
</style>
</head>
<body>

<header>
  <h1>오늘의 밥상</h1>
  <div class="date" id="date"></div>
</header>

<div class="table" id="table" aria-label="밥상"></div>
<p class="count" id="count"></p>

<!--
  ===== 반찬 목록 =====
  한 줄에 하나씩: <li>이모지 이름</li>
  예) <li>🥚 계란말이</li>
      <li>🐟 고등어구이</li>
      <li>🌱 콩나물무침</li>
-->
<ul id="banchan">
  <li>🍚 밥</li>
  <li>🍲 국</li>
  <li>🥬 김치</li>
</ul>

<script>
  const items = [...document.querySelectorAll('#banchan li')]
    .map(li => li.textContent.trim())
    .filter(Boolean)
    .map(text => {
      const i = text.indexOf(' ');
      return i < 0 ? { emoji: '🍽️', name: text }
                   : { emoji: text.slice(0, i), name: text.slice(i + 1).trim() };
    });

  const table = document.getElementById('table');
  const n = items.length;

  // 반찬 수에 따라 카드 크기와 배치 반지름 조절 (% 단위라 화면 크기에 맞춰짐)
  const size = n <= 3 ? 24 : n <= 5 ? 21 : n <= 8 ? 17 : Math.max(11, 17 - (n - 8));
  const radius = n === 1 ? 0 : n <= 3 ? 24 : 34 - size * 0.3;

  items.forEach((item, idx) => {
    const angle = -Math.PI / 2 + (idx / n) * Math.PI * 2;
    const card = document.createElement('div');
    card.className = 'dish';
    card.style.setProperty('--x', (50 + radius * Math.cos(angle)) + '%');
    card.style.setProperty('--y', (50 + radius * Math.sin(angle)) + '%');
    card.style.setProperty('--size', size + '%');
    card.style.setProperty('--delay', (idx * 0.08) + 's');
    card.innerHTML = '<span class="emoji"></span><span class="name"></span>';
    card.querySelector('.emoji').textContent = item.emoji;
    card.querySelector('.name').textContent = item.name;
    table.appendChild(card);
  });

  document.getElementById('count').textContent = `오늘은 ${n}가지 찬이 올라왔어요.`;
  const d = new Date();
  const days = '일월화수목금토';
  document.getElementById('date').textContent =
    `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
</script>
</body>
</html>
